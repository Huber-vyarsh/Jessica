<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday, Jessica</title>
    
    <!-- Google Fonts: Playfair Display (Serif) & Inter (Sans-serif) -->
    <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap)" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/countdown.css">
</head>
<body>

    <!-- SCENE 1: THE COUNTDOWN -->
    <main id="scene-opening" class="scene active">
        
        <div class="opening-subtitle">For Jessica</div>
        <div class="opening-title" id="display-date">07 · 09 · 2026</div>

        <div class="countdown-container">
            <div class="time-block">
                <span class="time-value" id="cd-days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-block">
                <span class="time-value" id="cd-hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-block">
                <span class="time-value" id="cd-minutes">00</span>
                <span class="time-label">Minutes</span>
            </div>
            <div class="time-block">
                <span class="time-value" id="cd-seconds">00</span>
                <span class="time-label">Seconds</span>
            </div>
        </div>

        <div class="lock-status">
            <div class="lock-message">Something special is waiting.</div>
            <div class="lock-badge"><span class="dot"></span> Birthday Locked</div>
        </div>
        
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/countdown.js"></script>
</body>
</html>
